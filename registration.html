<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis — Registration</title>
</head>

<body>
  <button id="sign-out-button" type="button">Sign Out</button>

  <h1>Complete your Aegis profile</h1>

  <form id="registration-form">
    <div>
      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        required
      >
    </div>

    <div>
      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        required
      >
    </div>

    <button type="submit">Continue</button>
  </form>

  <p id="status"></p>

  <script type="module" src="/src/registration.js"></script>
</body>
</html>
