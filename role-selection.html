<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis — Choose Your Role</title>
</head>

<body>
  <main>
    <h1>How will you use Aegis?</h1>
    <p>Select the role you are registering for.</p>

    <section>
      <button type="button" data-role="victim">
        Victim
      </button>

      <button type="button" data-role="volunteer">
        Volunteer
      </button>

      <button type="button" data-role="stationOp">
        Relief Station Operator
      </button>

      <button type="button" data-role="shelterOp">
        Shelter Operator
      </button>
    </section>
  </main>

  <script type="module" src="/src/role-selection.js"></script>
</body>
</html>
